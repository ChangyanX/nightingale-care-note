name: Required micro-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  micro-tests:
    name: Nightingale required micro-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/backend

    env:
      APP_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        run: uv sync --dev --locked

      - name: Run required and bonus micro-tests
        run: |
          uv run pytest \
            tests/test_rbac_scope.py \
            tests/test_revision_history.py \
            tests/test_highlight_provenance.py \
            tests/test_concurrent_edits.py \
            tests/test_self_learning_importance.py
